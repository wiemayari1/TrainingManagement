version: "3.8"

services:

  mysql:
    image: mysql:8.4
    container_name: training-mysql
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./db/data.sql:/docker-entrypoint-initdb.d/2-data.sql:ro
    ports:
      - "3306:3306"
    networks:
      - training-network


  backend:
    build:
      context: ./backend
    container_name: training-backend
    restart: always
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}

      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

      FRONTEND_URL: ${FRONTEND_URL}

    ports:
      - "8081:8081"

    networks:
      - training-network


  frontend:
    build:
      context: ./frontend
    container_name: training-frontend
    restart: always
    depends_on:
      - backend

    ports:
      - "3000:3000"

    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - training-network


volumes:
  mysql_data:


networks:
  training-network:
    driver: bridge
